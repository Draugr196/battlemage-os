# Fallback portal choice when the session doesn't identify its desktop
# (headless GNOME sessions): use GNOME's backend, which provides ScreenCast
# and RemoteDesktop for Selkies, then GTK for anything GNOME's lacks.
# Same order GNOME's own gnome-portals.conf uses, so normal sessions are
# unaffected.
[preferred]
default=gnome;gtk;
