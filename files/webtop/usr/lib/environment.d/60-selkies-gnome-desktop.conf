# Headless GNOME sessions started by Fedora's gdm-headless-login-session come
# up without XDG_CURRENT_DESKTOP, so xdg-desktop-portal can't tell it's GNOME
# and falls back to the GTK backend, which has no ScreenCast/RemoteDesktop.
# Selkies then has nothing to capture. Only fills it in when it's unset.
XDG_CURRENT_DESKTOP=${XDG_CURRENT_DESKTOP:-GNOME}
