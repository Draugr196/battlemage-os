# Setup state
d /var/lib/selkies 0755 root root -
# Front sockets Caddy connects to (/run/selkies/<user>.sock), root-owned
d /run/selkies 0750 root caddy -
# Caddy's home. The RPM ships it, but image-based installs don't create
# package directories under /var, so Caddy can't write its state/locks.
d /var/lib/caddy 0750 caddy caddy -
